<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Decisor Operacional • VPD + PAR</title>
<meta name="theme-color" content="#1f6feb"/>

<style>
:root{
  --bg1:#0ea5e9;
  --bg2:#7c3aed;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --ok:#16a34a;
  --warn:#f59e0b;
  --bad:#ef4444;
  --line:#e5e7eb;
  --shadow: 0 10px 24px rgba(2,6,23,.12);
  --r:16px;
}

*{ box-sizing:border-box; }
body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 600px at 20% 0%, rgba(14,165,233,.35), transparent 60%),
    radial-gradient(1200px 600px at 80% 0%, rgba(124,58,237,.25), transparent 60%),
    #f8fafc;
  padding: 16px;
}

.wrap{ max-width: 820px; margin: 0 auto; }

.top{
  background: linear-gradient(135deg, var(--bg1), var(--bg2));
  border-radius: 22px;
  padding: 16px;
  color:#fff;
  box-shadow: var(--shadow);
}

.titleRow{ display:flex; gap:12px; align-items:center; }

.badgeIcon{
  width:44px;height:44px;border-radius:14px;
  background: rgba(255,255,255,.18);
  display:grid;place-items:center;
  border: 1px solid rgba(255,255,255,.25);
}

.top h1{ margin:0; font-size: 18px; }
.top p{ margin:4px 0 0; font-size: 13px; opacity:.9; }

.grid{
  display:grid;
  grid-template-columns: 1.1fr .9fr;
  gap: 14px;
  margin-top: 14px;
}
@media (max-width: 860px){
  .grid{ grid-template-columns: 1fr; }
}

.card{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px;
  box-shadow: 0 6px 18px rgba(2,6,23,.06);
}

.card h2{
  margin:0 0 10px 0;
  font-size: 14px;
  display:flex; align-items:center; gap:8px;
}

.muted{ color: var(--muted); font-size: 12.5px; }

label{
  display:block;
  font-weight: 700;
  font-size: 12.5px;
  margin: 10px 0 6px;
}

input, select{
  width:100%;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  padding: 11px 12px;
  font-size: 16px;
  background: #fff;
}

input:focus, select:focus{
  border-color:#60a5fa;
  box-shadow: 0 0 0 4px rgba(96,165,250,.22);
  outline:none;
}

.moduleBtns{ display:flex; gap:10px; flex-wrap:wrap; }

.mBtn{
  border:1px solid #d1d5db;
  background:#fff;
  border-radius: 14px;
  padding: 10px 12px;
  cursor:pointer;
  display:flex; align-items:center; gap:10px;
  min-width: 160px;
  transition: .15s ease;
}

.mBtn.active{
  border-color:#60a5fa;
  box-shadow: 0 0 0 4px rgba(96,165,250,.22);
}

.mTag{
  width:34px;height:34px;border-radius:12px;
  display:grid;place-items:center;
  color:#fff;font-weight:800;
  background: linear-gradient(135deg, #22c55e, #0ea5e9);
}
.mBtn[data-m="2"] .mTag{ background: linear-gradient(135deg, #f59e0b, #ef4444); }
.mBtn[data-m="3"] .mTag{ background: linear-gradient(135deg, #7c3aed, #1f6feb); }

.row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btnMain{
  width:100%;
  margin-top: 12px;
  border:0;
  border-radius: 14px;
  padding: 12px;
  font-weight: 800;
  font-size: 16px;
  cursor:pointer;
  background: linear-gradient(135deg, #1f6feb, #0ea5e9);
  color:#fff;
  box-shadow: var(--shadow);
}

.sep{ height:1px; background: var(--line); margin: 10px 0; }

.programBox{
  border: 1px dashed #cbd5e1;
  border-radius: 14px;
  padding: 10px 12px;
  background: #f8fafc;
}

.pill{
  display:inline-block;
  padding: 6px 12px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 12px;
}
.ok{ background: rgba(22,163,74,.12); color: var(--ok); }
.warn{ background: rgba(245,158,11,.14); color: #b45309; }
.bad{ background: rgba(239,68,68,.12); color: var(--bad); }

.vpdBig{
  text-align:center;
  font-weight: 900;
  font-size: 40px;
  margin: 6px 0;
}
.vpdBig.ok{ color: var(--ok); }
.vpdBig.warn{ color: var(--warn); }
.vpdBig.bad{ color: var(--bad); }

ul{ margin: 8px 0 0 18px; padding:0; }
li{ margin: 6px 0; }
</style>
</head>

<body>
<div class="wrap">

  <div class="top">
    <div class="titleRow">
      <div class="badgeIcon">🌱</div>
      <div>
        <h1>Decisor Operacional</h1>
        <p>Controle climático • VPD + PAR</p>
      </div>
    </div>
  </div>

  <div class="grid">

    <!-- ENTRADAS -->
    <div class="card">
      <h2>Entradas</h2>

      <label>Módulo</label>
      <div class="moduleBtns">
        <button class="mBtn active" data-m="1" onclick="setModulo(1)"> <div class="mTag">M1</div> Pegamento</button>
        <button class="mBtn" data-m="2" onclick="setModulo(2)"> <div class="mTag">M2</div> Indução</button>
        <button class="mBtn" data-m="3" onclick="setModulo(3)"> <div class="mTag">M3</div> Endurecimento</button>
      </div>

      <div class="row2">
        <div>
          <label>Temperatura (°C)</label>
          <input id="temp" type="number" step="0.1"/>
        </div>
        <div>
          <label>Umidade (%)</label>
          <input id="ur" type="number" step="0.1"/>
        </div>
      </div>

      <label>PAR (µmol m⁻² s⁻¹)</label>
      <input id="par" type="number"/>

      <label>Programa atual</label>
      <select id="prog"></select>

      <div class="programBox" id="progInfo" style="margin-top:10px;"></div>

      <button class="btnMain" onclick="calcular()">Calcular</button>
    </div>

    <!-- RESULTADO -->
    <div class="card">
      <h2>Resultado</h2>
      <div id="saida">Preencha os dados.</div>
    </div>

  </div>
</div>

<script>
// ================= METAS =================
const metas = {
  1: { vpdMin:0.3, vpdMax:0.6, parMin:50,  parMax:150 },
  2: { vpdMin:0.6, vpdMax:0.9, parMin:150, parMax:300 },
  3: { vpdMin:0.9, vpdMax:1.2, parMin:300, parMax:500 }
};

// ============== PROGRAMAS ===============
const programas = [
  { id:"P1", horario:"08:00–10:00", objetivo:"Arranque suave", on:5,  int:20 },
  { id:"P2", horario:"10:00–12:00", objetivo:"Rad subiendo", on:10, int:20 },
  { id:"P3", horario:"12:00–15:00", objetivo:"Límite térmico", on:10, int:8  },
  { id:"P4", horario:"15:00–16:00", objetivo:"Límite tardío", on:10, int:10 },
  { id:"P5", horario:"16:00–17:30", objetivo:"Tarde caliente", on:10, int:20 },
  { id:"P6", horario:"17:30–19:30", objetivo:"Extensión térmica", on:8,  int:20 },
  { id:"P7", horario:"19:30–21:00", objetivo:"Ventana sanitaria", on:0,  int:null }
];

let modulo = 1;

// ============== VPD ======================
function calcVPD(T, RH){
  const es = 0.6108 * Math.exp((17.27 * T) / (T + 237.3));
  return es * (1 - RH/100);
}

// ============ HORÁRIO AUTOMÁTICO =========
function min(h){ const [a,b]=h.split(":").map(Number); return a*60+b; }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }

function detectPrograma(){
  const t = nowMin();
  if (t>=min("08:00") && t<min("10:00")) return 0;
  if (t>=min("10:00") && t<min("12:00")) return 1;
  if (t>=min("12:00") && t<min("15:00")) return 2;
  if (t>=min("15:00") && t<min("16:00")) return 3;
  if (t>=min("16:00") && t<min("17:30")) return 4;
  if (t>=min("17:30") && t<min("19:30")) return 5;
  return 6;
}

function autoPrograma(){
  const sel = document.getElementById("prog");
  const idx = detectPrograma();
  if (String(sel.value)!==String(idx)){
    sel.value = idx;
    renderPrograma();
    calcular(false);
  }
}

// ============ INTERFACE ==================
function setModulo(m){
  modulo = m;
  document.querySelectorAll(".mBtn").forEach(b=>{
    b.classList.toggle("active", Number(b.dataset.m)===m);
  });
  calcular(false);
}

function loadProgramas(){
  const sel = document.getElementById("prog");
  programas.forEach((p,i)=>{
    const o = document.createElement("option");
    o.value=i;
    o.textContent = `${p.id} • ${p.horario}`;
    sel.appendChild(o);
  });
  renderPrograma();
}

function renderPrograma(){
  const idx = Number(document.getElementById("prog").value||0);
  const p = programas[idx];
  document.getElementById("progInfo").innerHTML =
    `<b>${p.id} • ${p.horario}</b><br>
     ${p.objetivo}<div class="sep"></div>
     Colnet ON: ${p.on}s • Intervalo: ${p.int ?? "—"} min`;
}

// ============ CÁLCULO ====================
function calcular(strict=true){
  const T = Number(temp.value);
  const RH = Number(ur.value);
  const PAR = Number(par.value);
  const idx = Number(prog.value||0);
  const p = programas[idx];
  const out = document.getElementById("saida");

  if (strict && (!T || !RH || RH<=0 || RH>100 || PAR<0)){
    out.innerHTML = `<span class="pill bad">Dados inválidos</span>`;
    return;
  }

  if (!T || !RH || RH<=0 || RH>100 || PAR<0) return;

  const vpd = calcVPD(T,RH);
  const meta = metas[modulo];

  let status="ok";
  if (vpd>meta.vpdMax) status="bad";
  else if (vpd<meta.vpdMin) status="warn";

  let rec = [];
  if (p.int){
    if (vpd>meta.vpdMax){
      rec.push(`Reduzir intervalo para ~${Math.round(p.int*0.7)} min.`);
    } else if (vpd<meta.vpdMin){
      rec.push(`Aumentar intervalo para ~${Math.round(p.int*1.3)} min.`);
    } else {
      rec.push("Manter programa.");
    }
  } else {
    rec.push("Programa sanitário — evitar molhar.");
  }

  if (PAR>meta.parMax) rec.push("PAR alto → aumentar sombra / laterais.");
  if (PAR<meta.parMin) rec.push("PAR baixo → reduzir sombra com cuidado.");
  if (T>30) rec.push("⚠️ T > 30°C → reforçar proteção térmica.");

  out.innerHTML = `
    <div class="pill ${status}">${status.toUpperCase()}</div>
    <div class="vpdBig ${status}">${vpd.toFixed(2)} kPa</div>
    <div><b>Recomendações</b></div>
    <ul>${rec.map(r=>`<li>${r}</li>`).join("")}</ul>
  `;
}

// ============ INIT =======================
loadProgramas();
autoPrograma();
setInterval(autoPrograma, 60000);
</script>
</body>
</html>
